name : Spring Boot App Deploy using Docker

on:
  push:
    branches:
        - main

env:
  IMAGE_NAME: ci-cd-practice
  CONTAINER_NAME: cicd-spring-app

jobs:
  build-deploy:
    # runs-on: ubuntu-latest
    # This tells GitHub to execute all of these steps on one of their temporary cloud servers.
    # As a result, your final step (Run the Container) will successfully start your Spring Boot application, 
    # but it will start it on GitHub's cloud. 
    # The moment the pipeline finishes (a few seconds later), GitHub will destroy that temporary server, 
    # and your running container will instantly vanish.

    # To make this run on your physical machine:
    runs-on: self-hosted
    
    steps:
        - name: Checkout Source
          uses: actions/checkout@v4

        - name: setting up Java
          uses: actions/setup-java@v4
          with:
             distribution: temurin
             java-version: 21
             cache: maven

        - name: Build Jar
          run:  mvn clean package -DskipTests

        - name: Login to DockerHub
          uses: docker/login-action@v3
          with:
            username: ${{ secrets.DOCKER_USERNAME }}
            password: ${{ secrets.DOCKER_PASSWORD }}

        - name: Building Docker Image
          run: |
            # docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest .
            # Following is just used for versioning, so rollback would be easy if there is any problem.
            docker build -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest \
            -t ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:${{ github.sha }} .

        - name: Push Image to DockerHub
          run: docker push ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }} --all-tags

        # - name: Deploy to EC2
        #   uses: appleboy/ssh-action@v1.2.0
        #   with:
        #       host: ${{ secrets.EC2_HOST }}
        #       username: ${{ secrets.EC2_USER }}
        #       key: ${{ secrets.EC2_SHH_KEY }}
        #       script: |
        #           docker pull ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
        #           docker stop ${{ env.CONTAINER_NAME }} || true
        #           docker rm ${{ env.CONTAINER_NAME }} || true
        #           docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped -p 8081:8081 ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
        #           docker image prune -f
        
        # If no EC2, deploy on Local Machine
        - name: Run the Container
          run: |
            docker stop ${{ env.CONTAINER_NAME }} || true
            docker rm ${{ env.CONTAINER_NAME }} || true
            # Runs the new container on port 8080
            docker run -d --name ${{ env.CONTAINER_NAME }} --restart unless-stopped -p 8081:8081 ${{ secrets.DOCKER_USERNAME }}/${{ env.IMAGE_NAME }}:latest
            docker image prune -f
